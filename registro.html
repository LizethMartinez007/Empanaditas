<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/registro.css">
    <a href="registro.html#Registro"></a>
    <a href="tienda.html#Tienda">
    <a href="registro.html#Menu1"></a>
</head>
<body>
    <section class="registro">
    <form action="" class="idd"> 
        <h1 class="titulo-formulario">Registro de usuario</h1>

        <fieldset>
        <legend>Datos Personales</legend>
         <article>
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" placeholder="Ej: Juan Carlos">
         </article>

         <article>
           <label for="apellido">Apellido:</label> 
           <input id="apellido" type="text" placeholder="Ej:Perez Diaz">
         </article>

         <article>
            <label for="ciudad">Ciudad:</label>
            <input id="ciudad" type="text" placeholder="Ej: Popayan">
         </article>

         <article>
            <label for="telefono">Telefono:</label>
            <input id="telefono" type="text" placeholder="Ej: 3145669809">
         </article>

         <article>
            <label for="email">Email:</label>
            <input id="email" type="email" placeholder="Ej: juanperez@gmail.com">
         </article>
        </fieldset>

        <fieldset>
        <legend>Datos de Cuenta</legend>
         <article>
                <label for="user">Nombre de usuario</label>
                <input id="user" type="text">
         </article>

         <article>
            <label for="Pass">Contraseña</label>
            <input id="pss" type="password">
         </article>
        </fieldset>

    <fieldset>
        <legend>Otros Datos</legend>
        <article>
            <label for="documento">Documento</label>
            <input id="documento" type="file">
        </article>

        <br>

        <article>
            <label for="fecha">Fecha de nacimiento</label>
            <input type="datetime-local" id="fecha">
        </article>
        
        <article>
            <legend class="seleccion2">Seleccion de genero</legend>
            <label for="seleccion">Masculino</label>
            <input type="checkbox">
            <label for="seleccion"> Femenino</label>
            <input type="checkbox">
        </article>

    </fieldset>

    <article>
        <input type="button" value="Guardar">
    </article>

    <article>
        <input type="reset">
    </article>
    </section>
</body>
</html>
